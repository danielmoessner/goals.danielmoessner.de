{% if notes %}
    {% if position == "bottom" %}<hr>{% endif %}
    <div class="grid gap-2 p-5 sm:grid-cols-3">
        {% for t in notes %}
            <div class="border {{ t.width_class }}">
                <div class="pt-1 pb-0.5 px-2 font-bold">
                    {{ t.name }}
                    {% include 'todos/symbols/buttons.html' %}
                </div>
                <hr>
                <div class="px-2 py-1">
                    <p>{{ t.notes|linebreaksbr }}</p>
                </div>
            </div>
        {% endfor %}
    </div>
    {% if position == "top" %}<hr>{% endif %}
{% endif %}
{% if page and position == "top" %}
    <div class="px-5 py-2">
        <a class="font-bold text-xs text-blue-600"
           href="{% url 'form' 'AddNoteToPage' %}?pk={{ page.pk }}&success={{ request.get_full_path }}">Add Note</a>
    </div>
    <hr>
{% endif %}
