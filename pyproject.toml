[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"

[tool.black]
line-length = 88

[tool.isort]
known_local_folder = ["apps", "config"]
profile = "black"

[tool.uv]
# Keep local development experience the same as before: `uv sync` installs dev
# tooling (ruff/black/isort/pytest, etc.). Production builds should use
# `uv sync --no-dev`.
default-groups = ["dev"]

[project]
name = "goals.danielmoessner.de"
version = "0.0.0"
description = ""
authors = [
    {name = "danielmoessner", email = "code@danielmoessner.de"},
]
readme = "README.md"
license = {text = "NONE"}
dependencies = [
    "django==6.*",
    "django-cors-headers==4.*",
    "django-filebrowser-no-grappelli==4.0.*",
    "django-tinymce==5.*",
    "pillow==12.*",
    "pytz==2026.*",
    "python-telegram-bot==22.*",
    "gunicorn==25.*",
    "django-debug-toolbar==6.*",
]
requires-python = "==3.14.*"

[dependency-groups]
dev = [
    "black==26.*",
    "djlint==1.36.*",
    "isort==8.*",
    "ruff==0.*",
    "pytest-django==4.*",
]
