---
# One-shot bootstrap for a new server:
# 1) provision Debian (Nginx + Docker)
# 2) migrate tmp/ from old -> new (secrets.json stays manual)
# 3) deploy the current image
#
# Requires an inventory containing both `app_old` (old) and `app` (new).

- import_playbook: provision.yml
- import_playbook: migrate.yml
- import_playbook: deploy.yml
