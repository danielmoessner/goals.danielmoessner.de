---
- name: Deploy (Docker Compose)
  hosts: goals
  become: true

  vars:
    secrets_path: "{{ goals_data_dir }}/secrets.json"

  tasks:
    - name: Determine image to deploy (explicit)
      set_fact:
        goals_image_effective: "{{ goals_image }}"
      when: goals_image is defined and goals_image | length > 0

    - name: Determine image to deploy (default to current git SHA / GITHUB_SHA)
      set_fact:
        goals_image_effective: "{{ goals_image_repo }}:sha-{{ lookup('env', 'GITHUB_SHA') | default(lookup('pipe', 'git rev-parse HEAD'), true) }}"
      when: goals_image is not defined or goals_image | length == 0

    - name: Ensure project directory exists
      file:
        path: "{{ goals_remote_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure data directories exist (group-writable for www-data / GID 33)
      file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: www-data
        mode: "2770"
      loop:
        - "{{ goals_data_dir }}"
        - "{{ goals_data_dir }}/static"
        - "{{ goals_data_dir }}/media"

    - name: Ensure tmp dir ownership/permissions (bind mount root)
      file:
        path: "{{ goals_data_dir }}"
        state: directory
        owner: root
        group: www-data
        mode: "2770"

    - name: Ensure runtime files exist (django.log, db.sqlite3)
      file:
        path: "{{ item }}"
        state: touch
        owner: root
        group: www-data
        mode: "0660"
      loop:
        - "{{ goals_data_dir }}/django.log"
        - "{{ goals_data_dir }}/db.sqlite3"

    - name: Install docker-compose.yml
      copy:
        src: "{{ playbook_dir }}/../docker-compose.yml"
        dest: "{{ goals_remote_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Check secrets.json exists (manual step)
      stat:
        path: "{{ secrets_path }}"
      register: secrets_stat

    - name: Abort if secrets.json is missing
      fail:
        msg: "Missing {{ secrets_path }}. Create it manually on the server before deploying."
      when: not secrets_stat.stat.exists

    - name: Ensure secrets.json permissions are readable by the container
      file:
        path: "{{ secrets_path }}"
        owner: root
        group: www-data
        mode: "0640"

    - name: Verify secrets.json is readable inside the container
      command: docker compose run --rm --no-deps --entrypoint sh web -lc "ls -l /django/tmp/secrets.json && python -c 'import json; json.load(open(\"/django/tmp/secrets.json\"))'"
      args:
        chdir: "{{ goals_remote_dir }}"
      environment:
        GOALS_IMAGE: "{{ goals_image_effective }}"
        GOALS_DATA_DIR: "{{ goals_data_dir }}"
        GOALS_BIND_IP: "{{ goals_bind_ip }}"
        GOALS_PORT: "{{ goals_port }}"

    - name: Pull image
      command: docker compose pull
      args:
        chdir: "{{ goals_remote_dir }}"
      environment:
        GOALS_IMAGE: "{{ goals_image_effective }}"
        GOALS_DATA_DIR: "{{ goals_data_dir }}"
        GOALS_BIND_IP: "{{ goals_bind_ip }}"
        GOALS_PORT: "{{ goals_port }}"

    - name: Migrate
      command: docker compose run --rm --no-deps web python manage.py migrate --noinput
      args:
        chdir: "{{ goals_remote_dir }}"
      environment:
        GOALS_IMAGE: "{{ goals_image_effective }}"
        GOALS_DATA_DIR: "{{ goals_data_dir }}"
        GOALS_BIND_IP: "{{ goals_bind_ip }}"
        GOALS_PORT: "{{ goals_port }}"

    - name: Collect static
      command: docker compose run --rm --no-deps web python manage.py collectstatic --noinput
      args:
        chdir: "{{ goals_remote_dir }}"
      environment:
        GOALS_IMAGE: "{{ goals_image_effective }}"
        GOALS_DATA_DIR: "{{ goals_data_dir }}"
        GOALS_BIND_IP: "{{ goals_bind_ip }}"
        GOALS_PORT: "{{ goals_port }}"

    - name: Start/update services
      command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ goals_remote_dir }}"
      environment:
        GOALS_IMAGE: "{{ goals_image_effective }}"
        GOALS_DATA_DIR: "{{ goals_data_dir }}"
        GOALS_BIND_IP: "{{ goals_bind_ip }}"
        GOALS_PORT: "{{ goals_port }}"

    - name: Reload Nginx
      service:
        name: nginx
        state: reloaded

    - name: Done
      debug:
        msg: "OK: deployed {{ goals_image_effective }}"
